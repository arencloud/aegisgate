<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title description">
  <title id="title">AegisGate: four questions behind secure access</title>
  <desc id="description">Identity: who are you? Inspection: does the request look safe? Permission: may you do this? Service trust: may this caller enter? These are responsibilities, not a literal network sequence.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#10283c"/><stop offset="1" stop-color="#0b1527"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#4c718b" opacity=".2"/></pattern>
  </defs>
  <rect width="1280" height="350" rx="24" fill="url(#background)"/>
  <rect width="1280" height="350" rx="24" fill="url(#dots)"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="38" y="43" fill="#71ddd0" font-size="14" font-weight="650" letter-spacing="2">THE STORY BEHIND EVERY REQUEST</text>
    <text x="38" y="83" fill="#f1f7ff" font-size="30" font-weight="650">Four questions. A clear reason for every decision.</text>
    <g transform="translate(38 111)">
      <rect width="289" height="170" rx="14" fill="#183146" stroke="#31516a"/>
      <text x="20" y="31" fill="#8fc6fc" font-size="13" letter-spacing="1.6">01 / IDENTITY</text>
      <text x="20" y="73" fill="#fff" font-size="25" font-weight="650">Who are you?</text>
      <text x="20" y="110" fill="#b4c9dc" font-size="17">Keycloak proves identity.</text>
      <text x="20" y="137" fill="#b4c9dc" font-size="17">Rust validates the result.</text>
    </g>
    <g transform="translate(343 111)">
      <rect width="289" height="170" rx="14" fill="#123638" stroke="#28625e"/>
      <text x="20" y="31" fill="#76dfcf" font-size="13" letter-spacing="1.6">02 / INSPECTION</text>
      <text x="20" y="73" fill="#fff" font-size="25" font-weight="650">Does it look safe?</text>
      <text x="20" y="110" fill="#b4d7d4" font-size="17">Coraza inspects requests.</text>
      <text x="20" y="137" fill="#b4d7d4" font-size="17">Matching attacks stop here.</text>
    </g>
    <g transform="translate(648 111)">
      <rect width="289" height="170" rx="14" fill="#29263e" stroke="#51466e"/>
      <text x="20" y="31" fill="#c2adf5" font-size="13" letter-spacing="1.6">03 / PERMISSION</text>
      <text x="20" y="73" fill="#fff" font-size="25" font-weight="650">May you do this?</text>
      <text x="20" y="110" fill="#c9c1de" font-size="17">Rust checks session + role.</text>
      <text x="20" y="137" fill="#c9c1de" font-size="17">RHCL enforces the decision.</text>
    </g>
    <g transform="translate(953 111)">
      <rect width="289" height="170" rx="14" fill="#183146" stroke="#31516a"/>
      <text x="20" y="31" fill="#8fc6fc" font-size="13" letter-spacing="1.6">04 / SERVICE TRUST</text>
      <text x="20" y="73" fill="#fff" font-size="25" font-weight="650">May this caller enter?</text>
      <text x="20" y="110" fill="#b4c9dc" font-size="17">Mesh policies check identity.</text>
      <text x="20" y="137" fill="#b4c9dc" font-size="17">Quarkus checks the caller.</text>
    </g>
    <text x="38" y="320" fill="#91aabd" font-size="15">A map of responsibilities · Follow the walkthrough for the actual request order.</text>
  </g>
</svg>
