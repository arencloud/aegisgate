apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-vault
  target:
    name: backend-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        BACKEND_TOKEN: '{{- if lt (len .token) 32 }}{{ fail "Backend token must contain at least 32 characters"
          }}{{ end -}}{{ .token }}'
  dataFrom:
    - extract:
        key: aegisgate/backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session-manager-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-vault
  target:
    name: session-manager-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KEYCLOAK_CLIENT_SECRET: '{{- if empty .client_secret }}{{ fail "Keycloak client_secret is required" }}{{
          end -}}{{ .client_secret }}'
        config.json: |-
          {{- if ne .realm "aegisgate" }}{{ fail "Keycloak realm must match the aegisgate import" }}{{ end -}}
          {{- if empty .client_id }}{{ fail "Keycloak client_id is required" }}{{ end -}}
          {
            "idle_seconds": 900,
            "absolute_seconds": 3600,
            "providers": [
              {
                "id": "keycloak",
                "name": "Keycloak",
                "issuer": {{ printf "https://auth.aegisgate.example.com/realms/%s" .realm | mustToJson }},
                "client_id": {{ .client_id | mustToJson }},
                "client_secret_env": "KEYCLOAK_CLIENT_SECRET",
                "roles_pointer": "/realm_access/roles",
                "role_mapping": {
                  "aegis-viewer": "viewer",
                  "aegis-operator": "operator",
                  "aegis-admin": "admin"
                }
              }
            ],
            "rules": [
              {
                "method": "GET",
                "path": "/api/projects",
                "roles": [
                  "viewer",
                  "operator",
                  "admin"
                ]
              },
              {
                "method": "GET",
                "path": "/api/overview",
                "roles": [
                  "viewer",
                  "operator",
                  "admin"
                ]
              },
              {
                "method": "POST",
                "path": "/api/deployments",
                "roles": [
                  "operator",
                  "admin"
                ]
              },
              {
                "method": "GET",
                "path": "/api/admin",
                "roles": [
                  "admin"
                ]
              }
            ]
          }
  dataFrom:
    - extract:
        key: aegisgate/keycloak
