apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application-api
spec:
  parentRefs:
    - name: aegisgate-gateway
      sectionName: https
  hostnames:
    - demo.aegisgate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: session-manager
          port: 8081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentication
spec:
  parentRefs:
    - name: aegisgate-gateway
      sectionName: https
  hostnames:
    - demo.aegisgate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: session-manager
          port: 8081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webui
spec:
  parentRefs:
    - name: aegisgate-gateway
      sectionName: https
  hostnames:
    - demo.aegisgate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webui
          port: 8080
