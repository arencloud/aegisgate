apiVersion: v1
kind: Service
metadata:
  name: webui
spec:
  selector:
    app: webui
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: session-manager
  labels:
    istio.io/use-waypoint: session-manager-waypoint
    istio.io/ingress-use-waypoint: 'true'
spec:
  selector:
    app: session-manager
  ports:
    - name: http
      port: 8081
      targetPort: http
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: session-check
spec:
  # The check-only listener authenticates Authorino at L4. Its sidecar does not
  # traverse destination waypoints; API/auth traffic uses the separate Service.
  selector:
    app: session-manager
  ports:
    - name: http-check
      port: 8082
      targetPort: check
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    istio.io/use-waypoint: backend-waypoint
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
