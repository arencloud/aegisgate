# Included by the AegisGate application Kustomization in the consuming namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: session-manager-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: session-manager-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        REDIS_URL: >-
          {{- if ne .username "default" }}{{ fail "Redkey requirepass uses the default user" }}{{ end -}}
          {{- if ne .database "0" }}{{ fail "AegisGate expects Redis database 0" }}{{ end -}}
          {{- if ne .port "6379" }}{{ fail "Redkey listens on port 6379" }}{{ end -}}
          {{- if not (regexMatch "^[A-Za-z0-9_-]+$" .password) }}{{ fail "Use a nonempty URL-safe password: letters, digits, underscore and hyphen" }}{{ end -}}
          redis://{{ .username }}:{{ .password }}@redis.aegisgate-cache.svc.cluster.local:{{ .port }}/{{ .database }}
  dataFrom:
    - extract:
        key: aegisgate/redis
