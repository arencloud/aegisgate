apiVersion: v1
kind: Service
metadata:
  # Stable application endpoint, separate from Redkey's managed headless Service.
  name: redis
  labels:
    istio.io/use-waypoint: redis-waypoint
spec:
  type: ClusterIP
  selector:
    redkey.inditex.dev/cluster: aegisgate-redis
    redkey.inditex.dev/component: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
