# Invalid branches invoke an intentionally undefined Go template with a static
# error label. This rejects bad records without ESO's removed Sprig fail function.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        password: >-
          {{- if ne .username "default" }}{{ template "aegisgate validation: Redkey requirepass uses the default user" }}{{ end -}}
          {{- if ne .database "0" }}{{ template "aegisgate validation: AegisGate expects Redis database 0" }}{{ end -}}
          {{- if ne .port "6379" }}{{ template "aegisgate validation: Redkey listens on port 6379" }}{{ end -}}
          {{- if not (regexMatch "^[A-Za-z0-9_-]+$" .password) }}{{ template "aegisgate validation: Use a nonempty URL-safe password: letters, digits, underscore and hyphen" }}{{ end -}}
          {{ .password }}
  dataFrom:
    - extract:
        key: aegisgate/redis
