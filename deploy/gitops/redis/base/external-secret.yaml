apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        password: >-
          {{- if ne .username "default" }}{{ fail "Redkey requirepass uses the default user" }}{{ end -}}
          {{- if ne .database "0" }}{{ fail "AegisGate expects Redis database 0" }}{{ end -}}
          {{- if ne .port "6379" }}{{ fail "Redkey listens on port 6379" }}{{ end -}}
          {{- if not (regexMatch "^[A-Za-z0-9_-]+$" .password) }}{{ fail "Use a nonempty URL-safe password: letters, digits, underscore and hyphen" }}{{ end -}}
          {{ .password }}
  dataFrom:
    - extract:
        key: aegisgate/redis
