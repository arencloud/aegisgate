apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisgate-cache
resources:
  - ../../base
patches:
  - target:
      version: v1
      kind: Namespace
      name: aegisgate-cache
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: aegisgate-cache
        labels:
          ambient-single-mesh: example-mesh
