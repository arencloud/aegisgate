# Example cluster settings; central Argo CD runs on a management cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisgate
resources:
- ../../base
- gateway-options.yaml
- tls-policy.yaml
patches:
- target:
    version: v1
    kind: Namespace
    name: aegisgate
  patch: |
    - op: add
      path: /metadata/labels/ambient-single-mesh
      value: example-mesh
    - op: remove
      path: /metadata/labels/argocd.argoproj.io~1managed-by
- target:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: aegisgate-gateway
  patch: |
    - op: add
      path: /spec/infrastructure
      value:
        parametersRef:
          group: ''
          kind: ConfigMap
          name: aegisgate-gateway-options
    - op: replace
      path: /spec/listeners/0/tls/certificateRefs/0/name
      value: aegisgate-app-tls
    - op: replace
      path: /spec/listeners/1/tls/certificateRefs/0/name
      value: aegisgate-auth-tls
