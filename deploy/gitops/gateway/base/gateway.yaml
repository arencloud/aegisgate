apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aegisgate-gateway
  namespace: aegisgate
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      hostname: demo.aegisgate.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: aegisgate-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: keycloak-https
      hostname: auth.aegisgate.example.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: aegisgate-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - aegisgate-identity
                  - aegisgate
