# Invalid branches invoke an intentionally undefined Go template with a static
# error label. This rejects bad records without ESO's removed Sprig fail function.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
        jdbc-url: '{{- if ne .sslmode "verify-full" }}{{ template "aegisgate validation: PostgreSQL sslmode must be verify-full" }}{{ end -}} {{- if not (regexMatch "^[A-Za-z0-9.-]+$"
          .host) }}{{ template "aegisgate validation: Invalid PostgreSQL host" }}{{ end -}} {{- if not (regexMatch
          "^[A-Za-z0-9_-]+$" .database) }}{{ template "aegisgate validation: Invalid PostgreSQL database" }}{{
          end -}} {{- if not (regexMatch "^[0-9]+$" .port) }}{{ template "aegisgate validation: Invalid PostgreSQL port" }}{{ end -}} jdbc:postgresql://{{ .host }}:{{ .port }}/{{ .database
          }}?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/truststores/secret-keycloak-db-ca/root.pem'
  dataFrom:
  - extract:
      key: aegisgate/postgresql
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-db-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: root.pem
    remoteRef:
      key: aegisgate/postgresql
      property: sslrootcert_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: '{{- if ne .realm "master" }}{{ template "aegisgate validation: Bootstrap admin realm must be master" }}{{ end -}} {{ .username }}'
        password: '{{ .password }}'
  dataFrom:
  - extract:
      key: aegisgate/keycloak/bootstrap
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-realm
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        realm: '{{ $c := .client | mustFromJson }}{{ if ne $c.realm "aegisgate" }}{{ template "aegisgate validation: Client realm must be aegisgate" }}{{ end }}{{ $c.realm }}'
        client_id: '{{ $c := .client | mustFromJson }}{{ if empty $c.client_id }}{{ template "aegisgate validation: Missing client field" }}{{ end }}{{ $c.client_id }}'
        client_secret: '{{ $c := .client | mustFromJson }}{{ if empty $c.client_secret
          }}{{ template "aegisgate validation: Missing client field" }}{{ end }}{{ $c.client_secret }}'
        admin_username: '{{ $u := .admin | mustFromJson }}{{ if or (ne $u.realm "aegisgate")
          (ne $u.role "aegis-admin") (not (kindIs "bool" $u.temporary)) }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if $u.temporary
          }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end }}{{ if empty
          $u.username }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.username }}'
        admin_password: '{{ $u := .admin | mustFromJson }}{{ if or (ne $u.realm "aegisgate")
          (ne $u.role "aegis-admin") (not (kindIs "bool" $u.temporary)) }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if $u.temporary
          }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end }}{{ if empty
          $u.password }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.password }}'
        admin_role: '{{ $u := .admin | mustFromJson }}{{ if or (ne $u.realm "aegisgate")
          (ne $u.role "aegis-admin") (not (kindIs "bool" $u.temporary)) }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if $u.temporary
          }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end }}{{ if empty
          $u.role }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.role }}'
        operator_username: '{{ $u := .operator | mustFromJson }}{{ if or (ne $u.realm
          "aegisgate") (ne $u.role "aegis-operator") (not (kindIs "bool" $u.temporary))
          }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if
          $u.temporary }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end
          }}{{ if empty $u.username }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.username
          }}'
        operator_password: '{{ $u := .operator | mustFromJson }}{{ if or (ne $u.realm
          "aegisgate") (ne $u.role "aegis-operator") (not (kindIs "bool" $u.temporary))
          }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if
          $u.temporary }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end
          }}{{ if empty $u.password }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.password
          }}'
        operator_role: '{{ $u := .operator | mustFromJson }}{{ if or (ne $u.realm
          "aegisgate") (ne $u.role "aegis-operator") (not (kindIs "bool" $u.temporary))
          }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if
          $u.temporary }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end
          }}{{ if empty $u.role }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.role
          }}'
        viewer_username: '{{ $u := .viewer | mustFromJson }}{{ if or (ne $u.realm
          "aegisgate") (ne $u.role "aegis-viewer") (not (kindIs "bool" $u.temporary))
          }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if
          $u.temporary }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end
          }}{{ if empty $u.username }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.username
          }}'
        viewer_password: '{{ $u := .viewer | mustFromJson }}{{ if or (ne $u.realm
          "aegisgate") (ne $u.role "aegis-viewer") (not (kindIs "bool" $u.temporary))
          }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if
          $u.temporary }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end
          }}{{ if empty $u.password }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.password
          }}'
        viewer_role: '{{ $u := .viewer | mustFromJson }}{{ if or (ne $u.realm "aegisgate")
          (ne $u.role "aegis-viewer") (not (kindIs "bool" $u.temporary)) }}{{ template "aegisgate validation: Invalid user realm, role or temporary flag" }}{{ end }}{{ if $u.temporary
          }}{{ template "aegisgate validation: This demo import expects temporary=false" }}{{ end }}{{ if empty
          $u.role }}{{ template "aegisgate validation: Missing user field" }}{{ end }}{{ $u.role }}'
  data:
  - secretKey: client
    remoteRef:
      key: aegisgate/keycloak
  - secretKey: admin
    remoteRef:
      key: aegisgate/keycloak/users/admin
  - secretKey: operator
    remoteRef:
      key: aegisgate/keycloak/users/operator
  - secretKey: viewer
    remoteRef:
      key: aegisgate/keycloak/users/viewer
