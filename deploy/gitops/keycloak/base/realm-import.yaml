apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: aegisgate
spec:
  keycloakCRName: keycloak
  placeholders:
    CLIENT_ID:
      secret:
        name: keycloak-realm
        key: client_id
    CLIENT_SECRET:
      secret:
        name: keycloak-realm
        key: client_secret
    ADMIN_USERNAME:
      secret:
        name: keycloak-realm
        key: admin_username
    ADMIN_ROLE:
      secret:
        name: keycloak-realm
        key: admin_role
    ADMIN_PASSWORD:
      secret:
        name: keycloak-realm
        key: admin_password
    OPERATOR_USERNAME:
      secret:
        name: keycloak-realm
        key: operator_username
    OPERATOR_ROLE:
      secret:
        name: keycloak-realm
        key: operator_role
    OPERATOR_PASSWORD:
      secret:
        name: keycloak-realm
        key: operator_password
    VIEWER_USERNAME:
      secret:
        name: keycloak-realm
        key: viewer_username
    VIEWER_ROLE:
      secret:
        name: keycloak-realm
        key: viewer_role
    VIEWER_PASSWORD:
      secret:
        name: keycloak-realm
        key: viewer_password
  realm:
    # The operator constructs the Secret filename before expanding placeholders.
    realm: aegisgate
    enabled: true
    displayName: AegisGate
    registrationAllowed: false
    resetPasswordAllowed: false
    sslRequired: all
    bruteForceProtected: true
    accessTokenLifespan: 3600
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 3600
    roles:
      realm:
      - name: aegis-viewer
      - name: aegis-operator
      - name: aegis-admin
    clients:
    - clientId: ${CLIENT_ID}
      secret: ${CLIENT_SECRET}
      name: AegisGate session manager
      enabled: true
      protocol: openid-connect
      publicClient: false
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      implicitFlowEnabled: false
      redirectUris:
      - https://demo.aegisgate.example.com/auth/callback
      webOrigins:
      - https://demo.aegisgate.example.com
      attributes:
        pkce.code.challenge.method: S256
      defaultClientScopes:
      - profile
      - email
      protocolMappers:
      - name: realm-roles-in-id-token
        protocol: openid-connect
        protocolMapper: oidc-usermodel-realm-role-mapper
        config:
          claim.name: realm_access.roles
          jsonType.label: String
          multivalued: 'true'
          id.token.claim: 'true'
          access.token.claim: 'true'
          userinfo.token.claim: 'true'
    users:
    - username: ${ADMIN_USERNAME}
      enabled: true
      emailVerified: true
      email: admin@aegisgate.example
      firstName: Demo
      lastName: Admin
      realmRoles:
      - ${ADMIN_ROLE}
      credentials:
      - type: password
        value: ${ADMIN_PASSWORD}
        temporary: false
    - username: ${OPERATOR_USERNAME}
      enabled: true
      emailVerified: true
      email: operator@aegisgate.example
      firstName: Demo
      lastName: Operator
      realmRoles:
      - ${OPERATOR_ROLE}
      credentials:
      - type: password
        value: ${OPERATOR_PASSWORD}
        temporary: false
    - username: ${VIEWER_USERNAME}
      enabled: true
      emailVerified: true
      email: viewer@aegisgate.example
      firstName: Demo
      lastName: Viewer
      realmRoles:
      - ${VIEWER_ROLE}
      credentials:
      - type: password
        value: ${VIEWER_PASSWORD}
        temporary: false
