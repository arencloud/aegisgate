apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisgate-identity
resources:
- ../../base
patches:
  - target:
      version: v1
      kind: Namespace
      name: aegisgate-identity
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: aegisgate-identity
        labels:
          ambient-single-mesh: example-mesh
